<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed teal: the OS applies its own mask (squircle / circle), so the
       source must reach every edge and keep the mark inside the central safe zone. -->
  <rect width="512" height="512" fill="#2F9BB3" />
  <g transform="translate(256 256) scale(4.8) translate(-50 -50)">
    <circle cx="50" cy="50" r="22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-dasharray="106 32" transform="rotate(130 50 50)" />
    <circle cx="50" cy="50" r="6.5" fill="#FFFFFF" />
  </g>
</svg>
