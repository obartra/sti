name: Visual regression

# Two paths driven by the `screenshot:update` label (mechanism copied from
# centaur):
#  1. Default (no label): the `visual` job runs `npm run test:visual` ->
#     check-baselines (fail on missing/stale) + lost-pixel diff. The merge gate.
#  2. With `screenshot:update` on the PR: the `update-passport` shards and
#     `update-info` regenerate baselines in parallel, then `update-commit`
#     assembles the slices, prunes stale, and the bot commits + pushes them
#     back to the PR branch in one commit.
#
# Render path is the pinned lost-pixel Docker image (linux/amd64) so pixels are
# stable between local Mac dev (Rosetta) and ubuntu-latest CI.

on:
  push:
    branches: [main]
    paths: ["passport/**", "info/**", ".github/workflows/visual.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why baselines are being regenerated"
        required: false
        default: "Approved via workflow_dispatch"

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  # Per-area gating on pull requests (same script and fail-open rules as
  # ci.yml): the passport shards skip on an info-only PR and vice versa.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passport: ${{ steps.areas.outputs.passport }}
      info: ${{ steps.areas.outputs.info }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: areas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed-areas.sh

  # The expensive capture+diff, fanned out: each shard shoots a deterministic
  # 1/N slice of the story corpus in parallel. Shards are self-contained (each
  # builds storybook) so they all start at once with no serial build step. Bump
  # SHARD_TOTAL and the matrix list together to add shards.
  visual-shard:
    needs: changes
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.passport == 'true') &&
      (github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'screenshot:update')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_TOTAL: 3
      # Capture is the whole job (the diff itself is sub-second): 4 parallel
      # shots on the 4-vcpu runner instead of the config's conservative 2.
      # A blank shot under contention self-heals (flakynessRetries, then the
      # isolation re-shoot in visual-regression.sh), and the baseline diff
      # makes any capture problem loud, never silent.
      LOST_PIXEL_CONCURRENCY: 4
    defaults:
      run:
        working-directory: passport
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:visual -- --shard ${{ matrix.shard }} --of ${{ env.SHARD_TOTAL }}
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diff-${{ matrix.shard }}
          path: |
            passport/storybook-static/index.json
            passport/.lostpixel/current/
            passport/.lostpixel/difference/
          if-no-files-found: ignore
          retention-days: 14

  # The info site's capture+diff: a small corpus (each built page at its three
  # gated widths), so one job with no shards. Same pinned image, same label
  # mechanics as the passport shards.
  info-visual:
    needs: changes
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.info == 'true') &&
      (github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'screenshot:update')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Same capture parallelism as the passport shards, same self-healing.
      LOST_PIXEL_CONCURRENCY: 4
    defaults:
      run:
        working-directory: info
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: info/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diff-info
          path: |
            info/.lostpixel/current/
            info/.lostpixel/difference/
          if-no-files-found: ignore
          retention-days: 14

  # Aggregate gate: keeps the required status check named "visual" stable while
  # the work fans out above. Passes when every shard and the info job passed or
  # was skipped by the area gating (a skip for an untouched area is a pass; a
  # failure or cancellation never is). On the screenshot:update path it is
  # skipped, exactly like them.
  visual:
    needs: [visual-shard, info-visual]
    if: |
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'screenshot:update'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the info job to pass or be area-skipped
        run: |
          ok() { test "$1" = "success" || test "$1" = "skipped"; }
          shards='${{ needs.visual-shard.result }}'
          info='${{ needs.info-visual.result }}'
          echo "visual-shard result: ${shards}; info-visual result: ${info}"
          ok "${shards}" && ok "${info}"

  # Baseline regeneration, fanned out like the gate: each shard re-shoots the
  # same deterministic 1/N story slice the gate diffs, at the same concurrency.
  # A filtered lost-pixel update PRUNES every baseline outside its page set, so
  # each shard writes its slice into a throwaway dir (never visual-baselines/)
  # and uploads it as an artifact; update-commit assembles the union. This cut
  # the label round-trip's slowest job from a serial full-corpus regen at
  # concurrency 2 to the gate's own shard shape.
  update-passport:
    # Only on the label being ADDED (not on every push while it is present), so the
    # PAT baseline push in update-commit (a `synchronize`) does not re-run this job.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'screenshot:update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_TOTAL: 3
      # Same capture parallelism and self-healing as the visual-shard gate jobs.
      LOST_PIXEL_CONCURRENCY: 4
      # The throwaway slice dir (repo-relative under passport/): the sharded
      # update refuses to run without it, see scripts/visual-regression.sh.
      LP_BASELINE_DIR: .lostpixel/slice
    defaults:
      run:
        working-directory: passport
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:visual:update -- --shard ${{ matrix.shard }} --of ${{ env.SHARD_TOTAL }}
      - name: Upload baseline slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-slice-${{ matrix.shard }}
          path: passport/.lostpixel/slice/
          if-no-files-found: error
          retention-days: 1
      # update-commit validates the assembled corpus shape against index.json
      # without rebuilding storybook; one shard ships the index.
      - name: Upload story index
        if: matrix.shard == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-index
          path: passport/storybook-static/index.json
          if-no-files-found: error
          retention-days: 1

  # The info site's baselines regenerate in parallel (small corpus, one job) so
  # one label click still covers both surfaces; the result rides an artifact to
  # update-commit like the passport slices.
  update-info:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'screenshot:update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LOST_PIXEL_CONCURRENCY: 4
    defaults:
      run:
        working-directory: info
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: info/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:visual:update
      - name: Upload info baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-info
          path: info/visual-baselines/
          if-no-files-found: error
          retention-days: 1

  # The single writer: assembles the passport slices and the info baselines,
  # validates the union, and makes the one label-removal + PAT push. Splitting
  # regeneration (above, parallel) from the commit keeps the push mechanics
  # identical to the old single update job.
  update-commit:
    needs: [update-passport, update-info]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Push baselines with a PAT when one is configured. A commit pushed with the
      # default GITHUB_TOKEN does NOT fire `push`/`pull_request`, so the required
      # checks (check/passport/e2e/integration/server/visual) never run on the new
      # head commit and the PR sits BLOCKED until someone close+reopens it. A
      # fine-grained PAT (repo contents:write) in `SCREENSHOT_BOT_TOKEN` makes the
      # baseline push re-trigger them automatically: this job removes the
      # screenshot:update label (with the built-in token, so that bot-authored
      # `unlabeled` fires nothing) and THEN pushes with the PAT, so the push's
      # `synchronize` re-runs CI and the visual gate (now label-off) on the new
      # commit, and the PR ends green with the label already gone. Absent the
      # secret this falls back to GITHUB_TOKEN (no auto-rerun); the close+reopen
      # workaround then applies and the step logs a notice saying so.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.SCREENSHOT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Assemble baselines from the regen artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Replace both baseline dirs wholesale with the regenerated union so
          # deletions (removed stories/pages) land in the commit too.
          rm -rf passport/visual-baselines info/visual-baselines
          mkdir -p passport/visual-baselines
          slices="$(mktemp -d)"
          gh run download "${RUN_ID}" --pattern 'baseline-slice-*' --dir "${slices}"
          cp "${slices}"/baseline-slice-*/*.png passport/visual-baselines/
          gh run download "${RUN_ID}" --name baseline-info --dir info/visual-baselines
          gh run download "${RUN_ID}" --name storybook-index --dir passport/storybook-static
          # The slices are complete by construction; this asserts it (and prunes
          # any stragglers) against the story corpus the shards captured from.
          (cd passport && ./scripts/check-baselines.sh --prune)
          # Each shard already blank-checked its slice; keep the union honest.
          blanks="$(find passport/visual-baselines info/visual-baselines -name '*.png' -size -10000c)"
          if [ -n "${blanks}" ]; then
            echo "::error::Blank baselines in the assembled set:"
            printf '  %s\n' ${blanks}
            exit 1
          fi
      - name: Commit + push updated baselines
        env:
          REASON: ${{ github.event.inputs.reason || 'screenshot:update label triggered regeneration' }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HAS_PAT: ${{ secrets.SCREENSHOT_BOT_TOKEN != '' }}
          # The label is removed as the bot (built-in token) so its `unlabeled`
          # event fires no workflow; the push below is what re-triggers the checks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop the label now (idempotent, best-effort) so it never lingers and so
          # the upcoming push runs the visual gate with the label already off.
          if [ -n "${PR}" ]; then
            gh pr edit "${PR}" --remove-label "screenshot:update" || true
          fi
          git add -A passport/visual-baselines/ info/visual-baselines/
          if git diff --staged --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git diff --staged --stat passport/visual-baselines/ info/visual-baselines/ | tail -20
          git commit -m "chore(visual): update baselines" -m "${REASON}" -m "Triggered by @${ACTOR} on ${BRANCH}."
          git push origin "HEAD:${BRANCH}"
          if [ "${HAS_PAT}" != "true" ]; then
            echo "::notice title=Baselines pushed with GITHUB_TOKEN::Required checks will not auto-rerun on this commit. Close+reopen the PR to trigger them, or set the SCREENSHOT_BOT_TOKEN secret (fine-grained PAT, contents:write) so future baseline pushes re-trigger CI automatically."
          fi
