name: Visual regression

# Two paths driven by the `screenshot:update` label (mechanism copied from
# centaur):
#  1. Default (no label): the `visual` job runs `npm run test:visual` ->
#     check-baselines (fail on missing/stale) + lost-pixel diff. The merge gate.
#  2. With `screenshot:update` on the PR: the `update` job regenerates baselines,
#     prunes stale, and the bot commits + pushes them back to the PR branch.
#
# Render path is the pinned lost-pixel Docker image (linux/amd64) so pixels are
# stable between local Mac dev (Rosetta) and ubuntu-latest CI.

on:
  push:
    branches: [main]
    paths: ["passport/**", "info/**", ".github/workflows/visual.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why baselines are being regenerated"
        required: false
        default: "Approved via workflow_dispatch"

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  # The expensive capture+diff, fanned out: each shard shoots a deterministic
  # 1/N slice of the story corpus in parallel. Shards are self-contained (each
  # builds storybook) so they all start at once with no serial build step. Bump
  # SHARD_TOTAL and the matrix list together to add shards.
  visual-shard:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'screenshot:update'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_TOTAL: 3
    defaults:
      run:
        working-directory: passport
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:visual -- --shard ${{ matrix.shard }} --of ${{ env.SHARD_TOTAL }}
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diff-${{ matrix.shard }}
          path: |
            passport/storybook-static/index.json
            passport/.lostpixel/current/
            passport/.lostpixel/difference/
          if-no-files-found: ignore
          retention-days: 14

  # The info site's capture+diff: a small corpus (each built page at a phone and
  # a desktop width), so one job with no shards. Same pinned image, same label
  # mechanics as the passport shards.
  info-visual:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'screenshot:update'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: info
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: info/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diff-info
          path: |
            info/.lostpixel/current/
            info/.lostpixel/difference/
          if-no-files-found: ignore
          retention-days: 14

  # Aggregate gate: keeps the required status check named "visual" stable while
  # the work fans out above. Passes only when every shard and the info job
  # passed; on the screenshot:update path it is skipped, exactly like them.
  visual:
    needs: [visual-shard, info-visual]
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'screenshot:update'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the info job to pass
        run: |
          shards='${{ needs.visual-shard.result }}'
          info='${{ needs.info-visual.result }}'
          echo "visual-shard result: ${shards}; info-visual result: ${info}"
          test "${shards}" = "success" && test "${info}" = "success"

  update:
    # Only on the label being ADDED (not on every push while it is present), so the
    # PAT baseline push below (a `synchronize`) does not re-run this whole job.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'screenshot:update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: passport
    steps:
      # Push baselines with a PAT when one is configured. A commit pushed with the
      # default GITHUB_TOKEN does NOT fire `push`/`pull_request`, so the required
      # checks (check/passport/e2e/integration/server/visual) never run on the new
      # head commit and the PR sits BLOCKED until someone close+reopens it. A
      # fine-grained PAT (repo contents:write) in `SCREENSHOT_BOT_TOKEN` makes the
      # baseline push re-trigger them automatically: this job removes the
      # screenshot:update label (with the built-in token, so that bot-authored
      # `unlabeled` fires nothing) and THEN pushes with the PAT, so the push's
      # `synchronize` re-runs CI and the visual gate (now label-off) on the new
      # commit, and the PR ends green with the label already gone. Absent the
      # secret this falls back to GITHUB_TOKEN (no auto-rerun); the close+reopen
      # workaround then applies and the step logs a notice saying so.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.SCREENSHOT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:visual:update
      # The info site's baselines regenerate in the same pass so one label click
      # covers both surfaces; unchanged pixels produce no diff to commit.
      - run: npm ci
        working-directory: info
      - run: npm run build
        working-directory: info
      - run: npm run test:visual:update
        working-directory: info
      - name: Commit + push updated baselines
        env:
          REASON: ${{ github.event.inputs.reason || 'screenshot:update label triggered regeneration' }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HAS_PAT: ${{ secrets.SCREENSHOT_BOT_TOKEN != '' }}
          # The label is removed as the bot (built-in token) so its `unlabeled`
          # event fires no workflow; the push below is what re-triggers the checks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop the label now (idempotent, best-effort) so it never lingers and so
          # the upcoming push runs the visual gate with the label already off.
          if [ -n "${PR}" ]; then
            gh pr edit "${PR}" --remove-label "screenshot:update" || true
          fi
          git add -A visual-baselines/ ../info/visual-baselines/
          if git diff --staged --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git diff --staged --stat visual-baselines/ | tail -20
          git commit -m "chore(visual): update baselines" -m "${REASON}" -m "Triggered by @${ACTOR} on ${BRANCH}."
          git push origin "HEAD:${BRANCH}"
          if [ "${HAS_PAT}" != "true" ]; then
            echo "::notice title=Baselines pushed with GITHUB_TOKEN::Required checks will not auto-rerun on this commit. Close+reopen the PR to trigger them, or set the SCREENSHOT_BOT_TOKEN secret (fine-grained PAT, contents:write) so future baseline pushes re-trigger CI automatically."
          fi
