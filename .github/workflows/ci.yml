name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs `make <target>` rather than inlining commands; the Makefile is
# the single source of truth (see `make help`). Steps that remain inline are
# environment setup (toolchains, deps, browsers), not gate commands.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check-root

  passport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
        working-directory: passport
      - run: make check-web
      # Browsable report of the spec/Gherkin scenarios (and every unit test),
      # uploaded so reviewers can open it from the run's Artifacts.
      - run: npm run test:report
        working-directory: passport
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: passport-test-report
          path: passport/html
          if-no-files-found: error

  integration:
    # The frontend api client against a real instance of the Go blind store:
    # publish -> resolve -> decrypt must round-trip. Needs both Node and Go, so
    # it is its own job; the test builds and boots the server itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
        working-directory: passport
      - run: make test-integration

  e2e:
    # The real app driven by a browser against a throwaway server: build + preview
    # the frontend, boot the Go store, seed a real card, and run the public
    # resolution journeys. Needs Node, Go, and a Playwright browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
        working-directory: passport
      - run: npx playwright install --with-deps chromium
        working-directory: passport
      - run: make test-e2e

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - run: make check-server
      - run: make vulncheck
      - run: make smoke
