name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  passport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passport
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      # Browsable report of the spec/Gherkin scenarios (and every unit test),
      # uploaded so reviewers can open it from the run's Artifacts.
      - run: npm run test:report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: passport-test-report
          path: passport/html
          if-no-files-found: error

  integration:
    # The frontend api client against a real instance of the Go blind store:
    # publish -> resolve -> decrypt must round-trip. Needs both Node and Go, so
    # it is its own job; the test builds and boots the server itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
        working-directory: passport
      - run: npm run test:integration
        working-directory: passport

  e2e:
    # The real app driven by a browser against a throwaway server: build + preview
    # the frontend, boot the Go store, seed a real card, and run the public
    # resolution journeys. Needs Node, Go, and a Playwright browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
        working-directory: passport
      - run: npx playwright install --with-deps chromium
        working-directory: passport
      - run: npm run test:e2e
        working-directory: passport

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || { echo "gofmt:"; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Alert script logic tests
        run: bash deploy/alert_test.sh
      - name: Vulnerability scan (stdlib + deps the code actually calls)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Full smoke against a local instance
        run: |
          go build -o /tmp/stiapi ./cmd/stiapi
          STI_DECOY_SECRET="$(openssl rand -hex 32)" STI_ADDR=127.0.0.1:8080 STI_DB_PATH="$(mktemp -u).db" /tmp/stiapi &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 0.25; done
          bash deploy/smoke.sh http://127.0.0.1:8080
