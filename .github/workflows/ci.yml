name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  passport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passport
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: passport/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cov

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || { echo "gofmt:"; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Vulnerability scan (stdlib + deps the code actually calls)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Full smoke against a local instance
        run: |
          go build -o /tmp/stiapi ./cmd/stiapi
          STI_DECOY_SECRET="$(openssl rand -hex 32)" STI_ADDR=127.0.0.1:8080 STI_DB_PATH="$(mktemp -u).db" /tmp/stiapi &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 0.25; done
          bash deploy/smoke.sh http://127.0.0.1:8080
