# Example capacity + error alerting rules for the sti.care blind backend.
#
# This is the "first deliverable" from labs/docs/12-observability-and-metrics.md
# section 3a, encoded so the thresholds live in version control rather than in
# someone's head. It is the full Prometheus-style form for a real scraper of the
# loopback /metrics endpoint (STI_METRICS_ADDR, default 127.0.0.1:9090, reached
# over an SSH tunnel since the port is never public), with proper for:/rate
# windows and history.
#
# The box's own minute-by-minute check (alert.sh via stiapi-alert.timer) already
# evaluates every rule below: the stateless gauges from a single scrape, and the
# rate/latency rules (shed, ratelimit, sensitive overload, errors, GET /a p99) by
# diffing against the previous scrape over the ~1-minute gap. Keep the thresholds
# here in step with alert.sh. A real Prometheus is still worth it for longer
# windows, smoothing, and dashboards; this file is ready for that day.
#
# Every series below is a blind aggregate (no id, IP, body, or token). The latency
# thresholds are grounded in a real bench.sh run on the prod box (see the p99 rule
# comment); the structural thresholds (shed, inflight ratio) reference MaxInflight.

groups:
  - name: sti-capacity
    rules:
      # Any visible shed means real callers are being turned away. The non-zero
      # signal is the alert; tune the page threshold to the box.
      - alert: StiShedRateNonZero
        expr: sum(rate(sti_shed_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Non-sensitive endpoints are shedding (503). The box needs a deliberate resize."

      - alert: StiRateLimitRejections
        expr: sum(rate(sti_ratelimit_rejections_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Visible 429 rate-limit rejections are occurring."

      # The sensitive reads never shed visibly; they fall back to the uniform
      # decoy / fixed reply under saturation. That fallback is invisible to users
      # by design, so it needs its own alert or saturation hides.
      - alert: StiSensitiveOverload
        expr: sum(rate(sti_sensitive_overload_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sensitive reads (/a, /knock) are hitting the uniform-overload fallback. Saturation is hidden from users; resize."

      # Windowed in-flight high-water vs the configured cap. inflight_highwater is
      # peak-since-start (useful for capacity review); for alerting use the
      # windowed current value so the ratio reflects now, not all-time.
      - alert: StiInflightNearCapWarn
        expr: max_over_time(sti_inflight_current[1m]) / sti_inflight_max > 0.80
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "In-flight requests above 80% of MaxInflight. Shedding is imminent."

      - alert: StiInflightNearCapPage
        expr: max_over_time(sti_inflight_current[1m]) / sti_inflight_max > 0.95
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "In-flight requests above 95% of MaxInflight."

      # p99 latency on the hot read. Baseline from bench.sh on the prod box (2 vCPU
      # Hetzner): at realistic low concurrency p99 is single-digit ms; under
      # saturating synthetic load (64 conns) the hot read holds ~4k req/s at p99
      # ~77ms (healthz ~28k, PUT ~21k). Warn 25ms / page 100ms flag sustained
      # degradation; saturation itself trips the shed and inflight alerts first.
      # Buckets are coarse by design (doc 12), so p99 here is a health trend, not a
      # fine-grained timing oracle.
      - alert: StiAliasP99LatencyWarn
        expr: |
          histogram_quantile(0.99,
            sum(rate(sti_request_duration_seconds_bucket{endpoint="/a/{id}"}[5m])) by (le)
          ) > 0.025
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GET /a p99 latency above 25ms (normal is single-digit ms)."

      - alert: StiAliasP99LatencyPage
        expr: |
          histogram_quantile(0.99,
            sum(rate(sti_request_duration_seconds_bucket{endpoint="/a/{id}"}[5m])) by (le)
          ) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "GET /a p99 latency above 100ms (normal is single-digit ms)."

      # Free disk on the database filesystem. A full disk corrupts SQLite/WAL and
      # breaks backups, so this pages early. Tune to the box size.
      - alert: StiDiskFreeLow
        expr: sti_disk_free_bytes < 2e9
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Less than ~2GB free on the database filesystem."

  - name: sti-health
    rules:
      # The background loop sets janitor_last_run_seconds every tick (~1m). If it
      # goes stale the loop stalled; knocks stop expiring and the send queue backs
      # up silently.
      - alert: StiJanitorStalled
        # Guard the startup-zero state: only alert once the loop has ticked at least once.
        expr: sti_janitor_last_run_seconds > 0 and time() - sti_janitor_last_run_seconds > 300
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Background janitor has not ticked in over 5 minutes."

      # A send queue with an old head is stuck even if depth looks normal.
      - alert: StiSendQueueStuck
        expr: sti_send_queue_oldest_age_seconds > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Oldest queued send is over 10 minutes old; the drain may be stuck."

  - name: sti-errors
    rules:
      - alert: StiInternalErrors
        expr: sum(rate(sti_errors_total[5m])) by (type) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Internal errors in subsystem {{ $labels.type }} (rate over 5m)."
