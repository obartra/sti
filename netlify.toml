# Netlify configuration for the STI Testing site.
# This is a static, single-file site with client-side routing, so there is
# no build step — Netlify just publishes the repository root as-is.

[build]
  # No build command needed; serve the files directly from the repo root.
  publish = "."

# Single-Page-App fallback.
# Real client-side routes look like /en, /es/hiv, /fr/gonorrhea. Those paths
# don't exist as files on disk, so without this rule visiting them directly
# (or refreshing) would 404. This serves index.html for any path that isn't a
# real file, and the in-page router reads location.pathname to render the right
# language/condition. Static assets that DO exist are still served normally,
# because non-forced redirects never shadow existing files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
