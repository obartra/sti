# Netlify configuration for sti.care.
# deploy/build-site.sh assembles dist/: the passport app at the root, the
# promises report at /promises, and Storybook at /design. The old info site
# under public/ is no longer published.

[build]
  publish = "dist"
  command = "bash deploy/build-site.sh"

# Single-Page-App fallback. The passport app is one page that routes by URL
# hash, so any path that isn't a real file serves the app's index.html. Real
# files (the report, Storybook, /assets/*) are served normally, because
# non-forced redirects never shadow existing files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + always-HTTPS headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Vite fingerprints asset filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell must revalidate so a deploy is picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
