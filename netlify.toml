# Netlify configuration for sti.care.
# deploy/build-site.sh assembles dist/: the passport app at the root and Storybook
# at /design. /promises is an app route (the in-app guarantees), not a static file.

[build]
  publish = "dist"
  command = "bash deploy/build-site.sh"

# Single-Page-App fallback. The passport app is one page that routes by URL hash
# (plus a few real paths like /promises and /exposed it reads itself), so any path
# that isn't a real file serves the app's index.html. Real files (Storybook,
# /assets/*) are served normally, because non-forced redirects never shadow them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + always-HTTPS headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Vite fingerprints asset filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell must revalidate so a deploy is picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker is never cached, so a fresh sw.js is fetched on every visit
# and a deploy takes effect at once (doc 22). A stale sw.js would pin the old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
