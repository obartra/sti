# Netlify configuration for sti.care.
# The contents of public/ are published as-is, plus one generated page: the
# promises report (public/promises/), rebuilt on every deploy so its version +
# date stamp always matches what is live.

[build]
  publish = "public"
  # Fetch tags first so the report's version stamp reads as the release tag
  # (git describe) rather than a bare sha on Netlify's shallow checkout.
  command = "git fetch --tags --force 2>/dev/null || true; npm run promises"

# Single-Page-App fallback.
# Client-side routes (/, /gonorrhea, /hiv, ...) aren't real files, so this
# serves index.html for any path that isn't a real file and the in-page router
# reads location.pathname to render the right topic. Real files (CSS, JS, the
# favicon) are still served normally, because non-forced redirects never shadow
# existing files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + always-HTTPS headers for every response.
# HSTS tells browsers to only ever connect over HTTPS (Netlify also has a
# "Force HTTPS" toggle in the dashboard that redirects http -> https).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Static assets aren't fingerprinted, so revalidate them on every load (cheap
# 304s) — this avoids serving a stale script/style after a deploy.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
